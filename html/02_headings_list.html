    <title>lists</title>
</head>
<body>
    <h1>Lorem, ipsum dolar.</h1>

    <em>dolar</em> sit.</p>

        <li>black tea</li>

    alt="">

        </ul>
    </div>
    <div>
        <h1>Inline
            elements
        </h1>

            <li>a tags</li>
            <li>img</li>
            <li>strong</li>
            <li>em</li>
        </ul>
    </div>
